<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>私有商店</title>
<style>
:root{color-scheme:dark;--bg:#0d1017;--panel:#161b26;--panel2:#1c2230;--line:#242c3d;--txt:#e9edf5;--sub:#93a0b8;
--acc:#37c8e8;--acc2:#2e6cff;--ok:#43d17c;--warn:#e6c35c;--bad:#f0707a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:
radial-gradient(1200px 500px at 50% -150px,#16283a 0%,var(--bg) 70%);color:var(--txt);margin:0;
padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:22px 2px 6px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0f3d4d,#177e96 60%,#2bd4ee);
display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 18px #0ee0ff2b}
h1{font-size:19px;margin:0;letter-spacing:.5px}
.sub{color:var(--sub);font-size:12px;margin-top:2px}
.gear{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:10px;
padding:8px 12px;font-size:13px}
#tokcfg{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;font-size:13px}
#nat{display:none;margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
display:none;align-items:center;gap:10px}
#nat .nname{font-size:13px;font-weight:600}
#nat .nchips{flex:1;font-size:11px;color:var(--sub);line-height:1.7}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;margin:2px 4px 2px 0;border:1px solid transparent}
.ok{background:#12331f55;color:var(--ok);border-color:#2a7f4a55}.warn{background:#3a2f1655;color:var(--warn);border-color:#7a651f55}
.bad{background:#3a1c1c55;color:var(--bad);border-color:#7a323255}.n{background:#20293a;color:var(--sub);border-color:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;
padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.card:hover{border-color:#2f3c55}
.row1{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.dot.run{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn)}
.name{font-weight:650;font-size:16px}
.ver{color:var(--sub);font-size:11px;background:#20293a;padding:2px 8px;border-radius:99px}
.beta{color:var(--warn);font-size:11px;border:1px solid #7a651f88;padding:1px 7px;border-radius:99px}
.desc{color:var(--sub);font-size:13px;line-height:1.55;flex:1}
.chips{display:flex;flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;
min-height:40px;background:linear-gradient(135deg,#2e9bff,#2e6cff);color:#fff}
button.gray{background:#242c3d;color:#c7d0e2}
button.red{background:transparent;color:var(--bad);border:1px solid #7a323288}
button.ghost{background:transparent;color:var(--acc);border:1px solid #1c6a7e}
a.open{color:var(--acc);text-decoration:none;font-size:13px;font-weight:600;padding:10px 8px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheetIn{background:#141a26;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;
max-height:80vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheetIn h3{margin:0 0 12px;font-size:16px}
#log{background:#0a0d13;border:1px solid var(--line);border-radius:12px;padding:12px;
font:11px/1.6 ui-monospace,monospace;white-space:pre-wrap;max-height:44vh;overflow:auto;color:#9fb3c8}
label{font-size:12px;color:var(--sub)}
input{background:#0b0f17;border:1px solid #2b3548;color:var(--txt);border-radius:10px;padding:11px;width:100%;font-size:14px}
input:focus{outline:none;border-color:var(--acc2)}
.pf{margin-bottom:12px}
.cfg{font-size:12px;color:var(--sub);margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="logo">🛍️</div>
  <div><h1>私有商店</h1><div class="sub">MINAS · 第三方 Docker 应用</div></div>
  <button class="gear" onclick="pullCat()" title="从远程货架刷新清单">🔄</button>
  <button class="gear" onclick="tgTok()">⚙️</button>
</header>
<span id="diskbadge" style="float:right;margin-top:2px"></span><div id="catinfo" style="font-size:12px;color:var(--sub);padding:2px 4px 8px"></div>
<div id="tokcfg"><div class="cfg">X-Store-Token（本地访问留空）</div>
  <input id="tok" placeholder="粘贴令牌"> 
  <button style="margin-top:8px" onclick="saveTok()">保存</button>
<div class="cfg" style="margin-top:14px">货架源（有序，排后面的同名覆盖前面；支持 <code>github:owner/repo[@分支]</code> 与 https 清单直链；全空=用服务启动参数）</div>
  <div id="srclist" style="margin-top:6px"></div>
  <button class="gray" style="margin-top:6px" onclick="addSrc()">＋ 添加货架源</button>
<div class="cfg" style="margin-top:10px">货架 Token（仅私有 GitHub 仓需要，fine-grained PAT 只读 Contents；留空=不修改）</div>
  <input id="cattoken" placeholder="留空不修改">
  <button style="margin-top:8px" onclick="saveCfg()">保存货架配置并拉新</button>
<div class="cfg" style="margin-top:16px">镜像清理（删除无容器引用的镜像释放 /data；在用镜像列灰不可选）</div>
<div id="imgbox" style="margin-top:6px;font-size:12px">未加载</div>
<button class="gray" style="margin-top:6px" onclick="loadImgs()">🧹 扫描镜像</button>
<button style="margin-top:6px" onclick="delImgs()">删除勾选</button></div>
<div id="nat"><span class="nname">容器出网</span><span class="nchips" id="natchips"></span><span id="natbtn"></span></div>
<div class="grid" id="apps">加载中…</div>
<div id="arch"></div>

<div class="sheet" id="parambox"><div class="sheetIn">
  <h3>⚙️ 安装参数 <span id="pname" style="color:var(--sub);font-weight:400"></span></h3>
  <div id="pform"></div>
  <button onclick="submitParams()">确定</button>
  <button class="gray" onclick="closeParams()">取消</button></div></div>

<div class="sheet" id="taskbox"><div class="sheetIn">
  <h3 id="taskname">任务</h3>
  <pre id="log"></pre>
  <button class="gray" onclick="closeTask()">关闭</button></div></div>

<script>
(function(){const h=decodeURIComponent(location.hash.replace(/^#/,''));try{if(h&&!localStorage.getItem('storeToken'))localStorage.setItem('storeToken',h.startsWith('tok-')?h.slice(4):h)}catch(e){}})();
const tok=()=>localStorage.getItem('storeToken')||'';
function tgTok(){const e=document.getElementById('tokcfg');e.style.display=e.style.display==='block'?'none':'block';if(e.style.display==='block')loadCfg()}
function saveTok(){localStorage.setItem('storeToken',document.getElementById('tok').value.trim());tgTok();load()}
let curTask=null,poll=null;
function srcRow(v){const d=document.createElement('div');d.style.cssText='display:flex;gap:6px;margin-bottom:6px;align-items:center';
 d.innerHTML='<input style="flex:1;font-size:12px" placeholder=\"github:owner/repo[@分支] 或 https://…/catalog.json\" value=\"'+esc(v)+'\"><button class=\"red\" style=\"padding:6px 10px\" onclick=\"this.parentNode.remove()\">✕</button>';
 document.getElementById('srclist').appendChild(d)}
function addSrc(){srcRow('')}
async function loadCfg(){try{const s=await api('api/settings');const box=document.getElementById('srclist');box.innerHTML='';(s.sources?s.sources.split(','):[]).forEach(v=>srcRow(v.trim()));if(!box.children.length)srcRow('');document.getElementById('cattoken').placeholder=s.hasToken?'已设置（留空不改）':'私有仓才需要，留空即可';}catch(e){}}
let imgCache=[];
function fmtGB(b){return b>=1073741824?(b/1073741824).toFixed(1)+'G':(b/1048576).toFixed(0)+'M'}
async function loadImgs(){const box=document.getElementById('imgbox');box.textContent='扫描中…';try{
  const d=await api('api/images');imgCache=d.images||[];
  const free=d.reclaimable||0;
  const rows=imgCache.map(im=>{const inUse=(im.usedBy||[]).length>0;
    return '<label style="display:flex;gap:6px;align-items:center;padding:3px 0'+(inUse?';opacity:.45':'')+'">'
      +(inUse?'<span style="width:14px"></span>':'<input type="checkbox" class="imgck" value="'+im.id+'">')
      +'<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+im.ref+'</span>'
      +'<span>'+im.human+'</span>'+(inUse?'<span title="'+im.usedBy.join(',')+'">在用</span>':'')+'</label>';}).join('');
  box.innerHTML='<div style="margin-bottom:4px">共 '+imgCache.length+' 镜像 · 可回收 <b style="color:'+(free>1073741824?'#2c7a43':'#c0392b')+'">'+fmtGB(free)+'</b></div>'+rows;
}catch(e){box.textContent='扫描失败: '+e}}
async function delImgs(){const ids=[...document.querySelectorAll('.imgck:checked')].map(c=>c.value);
  if(!ids.length){alert('先勾选要删的镜像');return}
  if(!confirm('删除 '+ids.length+' 个镜像？拉过的话下次装还得重新导入'))return;
  try{const d=await api('api/images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
    let msg='删除 '+(d.deleted||[]).length+' 个';if((d.failed||[]).length)msg+='\n失败:\n'+d.failed.join('\n');
    alert(msg);loadImgs();load();}catch(e){alert('删除失败 '+e)}}
async function saveCfg(){const srcs=[...document.querySelectorAll('#srclist input')].map(i=>i.value.trim()).filter(Boolean).join(',');const b={sources:srcs};const t=document.getElementById('cattoken').value.trim();if(t)b.token=t;try{const d=await api('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});alert(d.ok||('失败: '+(d.error||'?')));loadCat();load();}catch(e){alert('保存失败 '+e)}}
function base(){const p=location.pathname;return p.endsWith('/')?p:p.replace(/\/[^\/]*$/,'/')}
async function api(p,opt){opt=opt||{};opt.headers=Object.assign({'X-Store-Token':tok()},opt.headers||{});return (await fetch(base()+p,opt)).json()}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function pullCat(){try{const d=await api('api/catalog',{method:'POST'});alert(d.ok||('刷新失败: '+(d.error||'?')));loadCat();load();}catch(e){alert('刷新失败 '+e)}}
async function loadCat(){try{const c=await api('api/catalog');document.getElementById('catinfo').textContent='货架 '+(c.sources||[]).join(' + ')+' · '+c.apps+' 商品 · 更新 '+c.updated;}catch(e){}}
function diskBadge(gb){if(gb==null||gb<0)return'';const warn=gb<1;return '<span style="margin-left:6px;padding:1px 7px;border-radius:8px;font-size:11px;background:'+(warn?'#fde8e8':'#e6f4ea')+';color:'+(warn?'#c0392b':'#2c7a43')+'">💾 剩 '+gb+'G'+(warn?' ⚠':'')+'</span>'}
async function load(){
  try{
  const d=await api('api/apps');
  if(d.error){throw new Error(d.error)}
  appCache={};(d.apps||[]).forEach(a=>appCache[a.id]=a);
  const nasIP=d.nasIP||'';
  document.getElementById('diskbadge').innerHTML=diskBadge(d.diskFreeGB>=0?d.diskFreeGB:null);
  const card=a=>{
    const ps=(a.docker.ports[0]||'').split(':'),port=ps.length>=3?ps[1]:ps[0];
    const ctr=ps.length>=3?ps[2]:(ps.length===2?ps[1]:ps[0]);
    const dot=a.running?'<span class="dot run"></span>':(a.containerState?'<span class="dot warn"></span>':'<span class="dot"></span>');
    const portTxt=a.docker.network==='host'?('host :'+port):(port+' → '+ctr);
    const chips=[
      '<span class="chip n">端口 '+portTxt+'</span>',
      a.archived?'<span class="chip warn">已下架</span>':'',
      a.beta?'<span class="chip warn">β 未实测</span>':'',
      a.running?'<span class="chip ok">运行中</span>':(a.containerState?'<span class="chip warn">'+esc(a.containerState)+'</span>':'<span class="chip n">未安装</span>'),
      a.registered?'<span class="chip ok">应用中心 ✓</span>':(a.vendorUninstalled?'<span class="chip warn">入口已被米家卸载 · 按卸载可清容器</span>':'')
    ].join('');
    const open=a.running&&port?'<a class="open" href="http://'+nasIP+':'+port+'/" target="_blank">打开 ↗</a>':'';
    const acts=a.containerState?(open+(a.running&&!a.archived?'<button class="gray" onclick="act(\'update\',\''+a.id+'\')">更新</button>':'')+'<button class="red" onclick="act(\'uninstall\',\''+a.id+'\')">卸载</button>'):(a.archived?'<span style="font-size:12px;opacity:.55">已下架 · 不再提供安装</span>':
      ('<button onclick="act(\'install\',\''+a.id+'\')">安装</button>'))
    return '<div class="card"><div class="row1">'+dot+'<span class="name">'+esc(a.name)+'</span><span class="ver">v'+esc(a.version)+'</span>'+(a.beta?'<span class="beta">β</span>':'')+'</div>'+
      '<div class="desc">'+esc(a.desc)+'</div><div class="chips">'+chips+'</div><div class="acts">'+acts+'</div></div>';
  };
  const list=d.apps||[];
  const show=list.filter(a=>!(a.archived&&!a.containerState));
  const gone=list.filter(a=>a.archived&&!a.containerState);
  document.getElementById('apps').innerHTML=show.map(card).join('')||'<div class="empty">目录是空的</div>';
  document.getElementById('apps').insertAdjacentHTML('beforeend','<div style="grid-column:1/-1;font-size:12px;opacity:.65;line-height:1.6;padding:2px 4px">※ 安装/更新/卸载请以本商店为准。在米家 App 插件中心里卸载只会摘走入口卡片，容器和数据依然在本机运行——回到此处按「卸载」才会彻底清理。</div>');
  const el=document.getElementById('arch');
  if(gone.length){
    const on=localStorage.getItem('showArch')==='1';
    el.innerHTML='<div style="font-size:12px;color:var(--sub);padding:12px 4px 6px">🗄 已下架 · 未安装（'+gone.length+'） <button class="gray" style="margin-left:8px" onclick="tgArch()">'+(on?'隐藏':'显示')+'</button></div>'+(on?'<div class="grid">'+gone.map(card).join('')+'</div>':'');
  }else{el.innerHTML=''}
  }catch(e){document.getElementById('apps').innerHTML='<div class="empty">加载失败: '+esc(String(e))+'<br>令牌没配对? <button onclick="tgTok()">设置令牌</button> · <button onclick="load()">重试</button></div>'}
}
function tgArch(){localStorage.setItem('showArch',localStorage.getItem('showArch')==='1'?'0':'1');load()}
let appCache={};
function act(action,id){
  if(action==='uninstall'){
    if(confirm('卸载 '+id+'？容器删除，/data/apps/'+id+' 配置保留。'))send(action,id,{});
    return;
  }
  const a=appCache[id]||{};const ps=a.params||[];
  if(!ps.length)return send(action,id,{});
  pending={action,id};
  document.getElementById('pname').textContent=a.name||id;
  document.getElementById('pform').innerHTML=ps.map(p=>
    '<div class="pf"><label>'+esc(p.label)+(p.required?' *':'')+'</label><br style="content:none">'+
    '<input data-pname="'+p.name+'" data-preq="'+(p.required?1:0)+'" type="'+(p.type==='password'?'password':'text')+'" value="'+esc(p.default||'')+'"></div>').join('');
  document.getElementById('parambox').classList.add('on');
}
async function send(action,id,params){
  const r=await api('api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action,params})});
  if(r.error)return alert(r.error);
  curTask=r.taskId;document.getElementById('taskbox').classList.add('on');
  document.getElementById('taskname').textContent=action+' '+id+' …';
  clearInterval(poll);poll=setInterval(pollTask,1500);pollTask();
}
let pending=null;
function submitParams(){
  const p={};let ok=true;
  document.querySelectorAll('#pform input').forEach(i=>{
    if(i.dataset.preq==='1'&&!i.value.trim())ok=false;
    p[i.dataset.pname]=i.value;
  });
  if(!ok)return alert('必填项不能为空');
  closeParams();
  send(pending.action,pending.id,p);pending=null;
}
function closeParams(){document.getElementById('parambox').classList.remove('on');pending=null}
async function pollTask(){
  if(!curTask)return;
  const t=await api('api/task?id='+curTask);
  if(t.error)return;
  const el=document.getElementById('log');
  el.textContent=(t.log||[]).join('\n');el.scrollTop=el.scrollHeight;
  if(t.done){clearInterval(poll);document.getElementById('taskname').textContent=t.kind+' '+t.appId+' → '+(t.state==='ok'?'✔ 完成':'✘ '+t.error);load()}
}
function closeTask(){curTask=null;clearInterval(poll);document.getElementById('taskbox').classList.remove('on')}
document.getElementById('tok').value=tok();load();loadNat();loadCat();setInterval(()=>{if(!curTask){load();loadNat()}},10000);
async function loadNat(){
  try{
    const n=await api('api/nat');const el=document.getElementById('nat');el.style.display='flex';
    document.getElementById('natchips').innerHTML=n.rule?'<span class="chip ok">出网规则在位</span>':'<span class="chip bad">出网规则缺失</span>'+
      (n.unit?'<span class="chip ok">boot unit ✓</span>':'<span class="chip n">重启后需再注入</span>');
    document.getElementById('natbtn').innerHTML=n.rule?'<button class="red" onclick="natAct(\'remove\')">卸载</button>':'<button onclick="natAct(\'inject\')">注入规则</button>';
  }catch(e){}
}
async function natAct(a){
  if(a==='remove'&&!confirm('卸载 MASQUERADE 规则？所有 bridge 容器（qb/anirss…）会立刻断网。'))return;
  const r=await api('api/nat?action='+a,{method:'POST'});
  if(r.error)return alert(r.error);
  loadNat();
}
</script>
</body>
</html>
